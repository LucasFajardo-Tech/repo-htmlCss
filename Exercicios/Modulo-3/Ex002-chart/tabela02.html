<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 600px;
            border-collapse: collapse;
            text-align: center;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: darkgray;
            color: white;
        }

        tbody tr:nth-child(2n){
            background-color: lightgray;
        }

        caption{
           font-size: 1.5em;
           font-weight: bold;
           padding: 10px;
           background-color: lightgray;
        }  
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>

    <table>
        <caption>População das Unidades Federtivas</caption>

        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 30px;">População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td>47.000.000</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>23.000.000</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>19.000.000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td><strong>89.000.000</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
